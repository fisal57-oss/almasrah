    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300d2ff'><path d='M4 10V17C4 18.1 4.9 19 6 19H18C19.1 19 20 18.1 20 17V10'/><path d='M2 8H22V10H2z'/><path d='M12 2C9.24 2 7 4.24 7 7H17C17 4.24 14.76 2 12 2z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#060D1A" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <title>نظام حجز مقاعد المسرح وبطاقات الـ QR Code</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class', theme: { extend: { colors: { obsidian: '#07070b', velvet: '#0e0e17' } } } }
    </script>
    <script>
      // GitHub Pages -> Supabase booking bridge. Runs before React and watches the existing hall-booking store.
      (() => {
        const KEY = 'theater_hall_bookings_v1';
        const API = 'https://qrytzuqlsvfsjukcvrdg.supabase.co/functions/v1/booking-requests';
        const nativeSet = Storage.prototype.setItem;
        let internal = false;
        const persistRemoteMeta = (requestId, meta) => {
          try {
            const rows = JSON.parse(localStorage.getItem(KEY) || '[]');
            const next = rows.map(b => (b.requestId || b.id) === requestId ? { ...b, requestId, trackingToken: meta.trackingToken || b.trackingToken || null, syncStatus: 'synced', updatedAt: new Date().toISOString() } : b);
            internal = true; nativeSet.call(localStorage, KEY, JSON.stringify(next)); internal = false;
          } catch (e) { internal = false; console.error('Booking metadata save failed', e); }
        };
        Storage.prototype.setItem = function(key, value) {
          nativeSet.call(this, key, value);
          if (internal || this !== localStorage || key !== KEY) return;
          try {
            const rows = JSON.parse(value || '[]');
            const b = rows[0];
            if (!b || b.trackingToken || b.syncStatus === 'syncing') return;
            const requestId = b.requestId || b.id;
            if (!requestId) return;
            const marked = rows.map((x, i) => i === 0 ? { ...x, requestId, syncStatus: 'syncing' } : x);
            internal = true; nativeSet.call(localStorage, KEY, JSON.stringify(marked)); internal = false;
            fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...b, requestId }) })
              .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
              .then(meta => persistRemoteMeta(requestId, meta))
              .catch(err => {
                console.error('Supabase booking sync failed', err);
                try { const current = JSON.parse(localStorage.getItem(KEY) || '[]'); internal = true; nativeSet.call(localStorage, KEY, JSON.stringify(current.map(x => (x.requestId || x.id) === requestId ? { ...x, syncStatus: 'failed' } : x))); internal = false; } catch (_) { internal = false; }
              });
          } catch (e) { console.error('Booking bridge failed', e); }
        };
        window.ALMSRAH_BOOKING_API = API;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
